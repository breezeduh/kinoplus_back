services:
  angie:
    image: docker.angie.software/angie:1.8.2-alpine
    volumes:
      - source: ./application/public/
        target: /application/public/
        type: bind
      - source: ./application/storage/
        target: /application/storage/
        type: bind
      - source: ./deploy/angie/default.conf
        target: /etc/angie/http.d/default.conf
        type: bind
    networks:
      - project_networks
    ports:
      - target: 80
        published: 8080
        protocol: tcp
        mode: host

  php:
    build:
      context: .
      dockerfile: ./deploy/dockerfiles/Dockerfile
    volumes:
      - source: ./application
        target: /application
        type: bind
    networks:
      - project_networks

  postgresql:
    image: postgres:17.4-alpine3.21
    environment:
      - POSTGRES_USER=test
      - POSTGRES_PASSWORD=test
      - POSTGRES_DB=test
    volumes:
      - source: project_postgres_data
        target: /var/lib/postgresql/data
        type: volume
    networks:
      - project_networks
    ports:
      - target: 5432
        published: 5432
        protocol: tcp
        mode: host

  pgadmin:
    container_name: pgadmin
    image: dockerhub.timeweb.cloud/dpage/pgadmin4:8.14@sha256:8a68677a97b8c8d1427dc915672a26d2c4a04376916a68256f53d669d6171be7
    environment:
      PGADMIN_DISABLE_POSTFIX: "yes"
      PGADMIN_DEFAULT_EMAIL: admin@admin.ru
      PGADMIN_DEFAULT_PASSWORD: admin
    volumes:
      - source: project_pgadmin_data
        target: /var/lib/pgadmin
        type: volume
    networks:
      - project_networks
    ports:
      - target: 80
        published: 8081
        protocol: tcp
        mode: host

volumes:
  project_postgres_data:
    name: project_postgres_data
    driver: local
  project_pgadmin_data:
    name: project_pgadmin_data
    driver: local

networks:
  project_networks:
    name: project_networks
    attachable: true
